<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Shop</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; color: #18181b; }
      header { display: flex; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid #e4e4e7; }
      .hero { max-width: 720px; margin: 80px auto; padding: 0 32px; text-align: center; }
      h1 { font-size: 44px; margin: 0 0 16px; }
      p { color: #52525b; font-size: 18px; }
      .badge { display: inline-block; background: #ecfdf5; color: #047857; border-radius: 999px; padding: 4px 12px; font-size: 13px; margin-bottom: 16px; }
      .cta { display: inline-block; margin-top: 24px; background: #047857; color: #fff; padding: 14px 28px; border-radius: 8px; text-decoration: none; }
      .price { margin-top: 40px; font-size: 15px; color: #71717a; }
    </style>
  </head>
  <body data-version="2">
    <header>
      <strong>Acme Shop</strong>
      <nav><a href="#pricing">Pricing</a></nav>
    </header>
    <main class="hero">
      <span class="badge">New: AI copilot included</span>
      <h1>Ship 10x faster with Acme AI</h1>
      <p>Everything your team needs to launch products without the busywork, now with an AI copilot.</p>
      <a class="cta" href="#signup">Get started free</a>
      <p class="price">From $24 per month</p>
    </main>
  </body>
</html>
